<!DOCTYPE html>
<!--
  PRIMEHOUSE — Fragment: layout.html
  Layout base reutilizado por todos os templates via th:replace
  Compatível com Thymeleaf + HTMX + Spring MVC
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="PRIMEHOUSE — Sistema de Gestão Imobiliária"/>
    <title th:text="${titulo} + ' | PRIMEHOUSE'">PRIMEHOUSE</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
          rel="stylesheet"/>

    <!-- Tailwind (gerado automaticamente) -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>

    <!-- PRIMEHOUSE Design System — padrão visual principal -->
    <link rel="stylesheet" th:href="@{/CSS/primehouse.css}"/>

    <!-- SweetAlert2 (notificações) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js" defer></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>

<!-- ===================================================================
     FRAGMENT: sidebar — barra lateral de navegação
     =================================================================== -->
<nav class="ph-sidebar" id="phSidebar" th:fragment="sidebar(paginaAtiva)">

    <!-- Brand / Logo -->
    <a th:href="@{/}" class="ph-sidebar__brand">
        <div class="ph-sidebar__logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </div>
        <div class="ph-sidebar__brand-text">
            <span class="ph-sidebar__brand-name">PRIMEHOUSE</span>
            <span class="ph-sidebar__brand-sub">Sistema Imobiliário</span>
        </div>
    </a>

    <nav class="ph-sidebar__nav">

        <!-- Seção principal -->
        <span class="ph-sidebar__section-label">Principal</span>

        <a th:href="@{/}"
           th:classappend="${paginaAtiva == 'inicio'} ? 'active' : ''"
           class="ph-sidebar__link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h1v7c0 .55.45 1 1 1h4v-4h2v4h4c.55 0 1-.45 1-1v-7h1c.41 0 .65-.47.4-.8l-9-11c-.19-.25-.51-.25-.71 0l-9 11c-.24.33-.01.8.4.8z"/></svg>
            Dashboard
        </a>

        <!-- Seção Imóveis -->
        <span class="ph-sidebar__section-label">Imóveis</span>

        <a th:href="@{/imovel/abrirpesquisar}"
           th:classappend="${paginaAtiva == 'imoveis-pesquisar'} ? 'active' : ''"
           class="ph-sidebar__link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Pesquisar Imóveis
        </a>

        <a th:href="@{/imovel/cadastrar}"
           th:classappend="${paginaAtiva == 'imoveis-cadastrar'} ? 'active' : ''"
           class="ph-sidebar__link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            Cadastrar Imóvel
        </a>

        <!-- Seção Usuários -->
        <span class="ph-sidebar__section-label">Locatários</span>

        <a th:href="@{/usuario/abrirpesquisar}"
           th:classappend="${paginaAtiva == 'usuarios-pesquisar'} ? 'active' : ''"
           class="ph-sidebar__link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Pesquisar Locatários
        </a>

        <a th:href="@{/usuario/cadastrar}"
           th:classappend="${paginaAtiva == 'usuarios-cadastrar'} ? 'active' : ''"
           class="ph-sidebar__link">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Cadastrar Locatário
        </a>

    </nav>

    <div class="ph-sidebar__footer">
        &copy; 2025 PRIMEHOUSE
    </div>
</nav>

<!-- ===================================================================
     FRAGMENT: topbar — barra superior
     =================================================================== -->
<header class="ph-topbar" th:fragment="topbar(tituloPagina, subtitulo)">
    <div class="ph-topbar__left">
        <!-- Botão toggle mobile -->
        <button class="ph-sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>

        <div>
            <div class="ph-topbar__title" th:text="${tituloPagina}">Dashboard</div>
            <div class="ph-topbar__breadcrumb" th:if="${subtitulo != null}">
                <a th:href="@{/}">Início</a>
                <span class="ph-topbar__breadcrumb-sep">›</span>
                <span th:text="${subtitulo}"></span>
            </div>
        </div>
    </div>

    <div class="ph-topbar__right">
        <!-- Indicador HTMX global -->
        <div id="loadingGlobal" class="htmx-indicator ph-flex ph-gap-2" style="align-items:center;color:var(--ph-primary);font-size:0.8rem;">
            <span class="ph-spinner"></span>
            <span>Carregando...</span>
        </div>

        <!-- Badge sistema -->
        <span class="ph-badge ph-badge--blue">Sistema v1.0</span>
    </div>
</header>

<!-- ===================================================================
     FRAGMENT: notificacoes — SweetAlert2 via HX-Trigger
     =================================================================== -->
<div th:fragment="notificacoes">
    <script th:if="${notificacao != null}" th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            Swal.fire({
                text:  /*[[${notificacao.mensagem}]]*/ '',
                icon:  /*[[${notificacao.tipo}]]*/ 'info',
                timer: /*[[${notificacao.intervalo}]]*/ 3000,
                timerProgressBar: true,
                showConfirmButton: false,
                toast: true,
                position: 'top-end',
                customClass: { popup: 'ph-swal-toast' }
            });
        });
    </script>

    <!-- Listener para notificações via HTMX HX-Trigger -->
    <script>
        document.addEventListener('exibirAlerta', function(evt) {
            const d = evt.detail;
            Swal.fire({
                text:  d.mensagem,
                icon:  d.tipo,
                timer: d.intervalo || 3000,
                timerProgressBar: true,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        });
    </script>
</div>

<!-- ===================================================================
     FRAGMENT: scripts-base — JS compartilhado por todas as páginas
     =================================================================== -->
<div th:fragment="scripts-base">
    <script>
        // ── Sidebar Mobile Toggle ──────────────────────────────────────────
        const sidebar  = document.getElementById('phSidebar');
        const toggle   = document.getElementById('sidebarToggle');
        const overlay  = document.getElementById('sidebarOverlay');

        function openSidebar() {
            sidebar  && sidebar.classList.add('open');
            overlay  && overlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar  && sidebar.classList.remove('open');
            overlay  && overlay.classList.remove('visible');
            document.body.style.overflow = '';
        }

        toggle  && toggle.addEventListener('click', function() {
            sidebar && sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        });

        overlay && overlay.addEventListener('click', closeSidebar);

        // Fecha ao pressionar ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeSidebar();
        });

        // ── HTMX — indicador global ────────────────────────────────────────
        document.body.addEventListener('htmx:beforeRequest', function() {
            document.querySelectorAll('.ph-htmx-spinner').forEach(el => el.style.display = 'inline-flex');
        });
        document.body.addEventListener('htmx:afterRequest', function() {
            document.querySelectorAll('.ph-htmx-spinner').forEach(el => el.style.display = 'none');
        });

        // ── HTMX — scroll ao topo após troca de conteúdo ──────────────────
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target && evt.detail.target.id) {
                evt.detail.target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    </script>
</div>

</html>
