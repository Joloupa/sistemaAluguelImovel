<!DOCTYPE html>
<!--
  PRIMEHOUSE — usuarios/pesquisar.html
  Página de pesquisa/listagem de locatários
  Spring MVC + Thymeleaf + HTMX
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pesquisar Locatários')}"></head>
<body class="ph-layout">

<!-- Overlay mobile -->
<div class="ph-sidebar-overlay" id="sidebarOverlay"></div>

<div class="ph-wrapper">

    <!-- ── Sidebar ── -->
    <th:block th:replace="~{fragments/layout :: sidebar('usuarios-pesquisar')}"/>

    <!-- ── Área principal ── -->
    <main class="ph-main">

        <!-- Topbar -->
        <th:block th:replace="~{fragments/layout :: topbar('Locatários', 'Pesquisar')}"/>

        <!-- Notificações flash -->
        <th:block th:replace="~{fragments/layout :: notificacoes}"/>

        <!-- Conteúdo -->
        <div class="ph-content">

            <!-- Header da página -->
            <div class="ph-page-header ph-flex-between" style="flex-wrap:wrap;gap:1rem;">
                <div>
                    <h1 class="ph-page-header__title">Pesquisar Locatários</h1>
                    <p class="ph-page-header__subtitle">Consulte e gerencie os locatários cadastrados</p>
                </div>
                <div class="ph-page-header__actions">
                    <a th:href="@{/usuario/cadastrar}" class="ph-btn ph-btn--primary">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        Novo Locatário
                    </a>
                </div>
            </div>

            <!-- Formulário de filtro (HTMX) -->
            <div id="formularioPesquisa"
                 hx-get="/usuario/abrirpesquisar"
                 hx-trigger="load"
                 hx-target="#formularioPesquisa"
                 hx-indicator="#loadingGlobal">

                <!-- FRAGMENT: formulario -->
                <div th:fragment="formulario">
                    <div class="ph-filter ph-mb-6">
                        <div class="ph-filter__header">
                            <div class="ph-filter__title">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zm-7-9v2h18V9H3zm3-4v2h12V5H6z"/></svg>
                                Filtros de Pesquisa
                            </div>
                        </div>

                        <div class="ph-filter__body">
                            <form id="formFiltroUsuario"
                                  hx-get="/usuario/pesquisar"
                                  hx-target="#tabelaUsuarios"
                                  hx-trigger="submit"
                                  hx-indicator="#loadingGlobal">

                                <div class="ph-form-grid ph-form-grid--4" style="margin-bottom:1.25rem;">

                                    <div class="ph-form-group" style="margin-bottom:0;">
                                        <label class="ph-form-label" for="codigoU">Código</label>
                                        <input type="number" id="codigoU" name="codigo" class="ph-form-control" placeholder="Ex: 1"/>
                                    </div>

                                    <div class="ph-form-group" style="margin-bottom:0;">
                                        <label class="ph-form-label" for="nomeU">Nome</label>
                                        <input type="text" id="nomeU" name="nome" class="ph-form-control" placeholder="Nome do locatário"/>
                                    </div>

                                    <div class="ph-form-group" style="margin-bottom:0;">
                                        <label class="ph-form-label" for="cpfU">CPF</label>
                                        <input type="text" id="cpfU" name="cpf" class="ph-form-control" placeholder="000.000.000-00"/>
                                    </div>

                                    <div class="ph-form-group" style="margin-bottom:0;">
                                        <label class="ph-form-label" for="emailU">E-mail</label>
                                        <input type="email" id="emailU" name="email" class="ph-form-control" placeholder="email@exemplo.com"/>
                                    </div>

                                    <div class="ph-form-group" style="margin-bottom:0;">
                                        <label class="ph-form-label" for="telefoneU">Telefone</label>
                                        <input type="text" id="telefoneU" name="telefone" class="ph-form-control" placeholder="(00) 00000-0000"/>
                                    </div>

                                </div>

                                <div class="ph-filter__actions">
                                    <button type="submit" class="ph-btn ph-btn--primary">
                                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                                        Pesquisar
                                    </button>
                                    <button type="reset" class="ph-btn ph-btn--outline"
                                            onclick="setTimeout(()=>document.getElementById('formFiltroUsuario').dispatchEvent(new Event('submit')),50)">
                                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                                        Limpar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Dispara a pesquisa automática -->
                    <div hx-get="/usuario/pesquisar"
                         hx-trigger="load"
                         hx-target="#tabelaUsuarios"
                         hx-indicator="#loadingGlobal">
                    </div>

                </div><!-- /th:fragment="formulario" -->
            </div>

            <!-- Área da tabela -->
            <div id="tabelaUsuarios">
                <div class="ph-flex-center" style="padding:3rem;color:var(--ph-text-muted);">
                    <span class="ph-spinner ph-spinner--lg" style="color:var(--ph-primary);"></span>
                </div>
            </div>

        </div><!-- /ph-content -->
    </main>
</div><!-- /ph-wrapper -->

<th:block th:replace="~{fragments/layout :: scripts-base}"/>

</body>
</html>
