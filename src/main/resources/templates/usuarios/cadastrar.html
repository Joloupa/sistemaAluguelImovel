<!DOCTYPE html>
<!--
  PRIMEHOUSE — usuarios/cadastrar.html
  Formulário de cadastro de locatário
  Controller: return "usuarios/cadastrar :: formulario"
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar Locatário')}"></head>
<body class="ph-layout">

<div class="ph-sidebar-overlay" id="sidebarOverlay"></div>

<div class="ph-wrapper">

    <th:block th:replace="~{fragments/layout :: sidebar('usuarios-cadastrar')}"/>

    <main class="ph-main">

        <th:block th:replace="~{fragments/layout :: topbar('Locatários', 'Cadastrar')}"/>
        <th:block th:replace="~{fragments/layout :: notificacoes}"/>

        <div class="ph-content">

            <div class="ph-page-header ph-flex-between" style="flex-wrap:wrap;gap:1rem;">
                <div>
                    <h1 class="ph-page-header__title">Cadastrar Locatário</h1>
                    <p class="ph-page-header__subtitle">Preencha os dados para registrar um novo locatário</p>
                </div>
                <div class="ph-page-header__actions">
                    <a th:href="@{/usuario/abrirpesquisar}" class="ph-btn ph-btn--outline">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        Voltar
                    </a>
                </div>
            </div>

            <div id="formularioCadastroUsuario"
                 hx-get="/usuario/cadastrar"
                 hx-trigger="load"
                 hx-target="#formularioCadastroUsuario"
                 hx-indicator="#loadingGlobal">

                <!-- ================================================================
                     FRAGMENT: formulario
                     ================================================================ -->
                <div th:fragment="formulario">

                    <div class="ph-card">

                        <div class="ph-card__header">
                            <div class="ph-card__title">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                </svg>
                                Dados do Locatário
                            </div>
                        </div>

                        <div class="ph-card__body">

                            <!-- Alertas globais de validação -->
                            <div th:if="${#fields.hasGlobalErrors()}"
                                 class="ph-alert ph-alert--danger ph-mb-6">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                                <div class="ph-alert__content">
                                    <div class="ph-alert__title">Corrija os erros abaixo</div>
                                    <ul style="margin:4px 0 0 1rem;font-size:var(--ph-font-size-xs);">
                                        <li th:each="erro : ${#fields.globalErrors()}"
                                            th:text="${erro}"></li>
                                    </ul>
                                </div>
                            </div>

                            <form th:action="@{/usuario/cadastrar}"
                                  th:object="${usuarioDTOInput}"
                                  method="post"
                                  hx-post="/usuario/cadastrar"
                                  hx-target="#formularioCadastroUsuario"
                                  hx-indicator="#loadingGlobal">

                                <!-- Dados pessoais -->
                                <div style="margin-bottom:1.5rem;">
                                    <h3 style="font-size:var(--ph-font-size-sm);font-weight:700;color:var(--ph-text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1rem;">
                                        Dados Pessoais
                                    </h3>

                                    <div class="ph-form-grid ph-form-grid--2">

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="nome">
                                                Nome Completo <span class="required">*</span>
                                            </label>
                                            <input type="text"
                                                   id="nome"
                                                   th:field="*{nome}"
                                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="Nome completo do locatário"
                                                   maxlength="255"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('nome')}"
                                                 th:errors="*{nome}"></div>
                                        </div>

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="cpf">
                                                CPF <span class="required">*</span>
                                            </label>
                                            <input type="text"
                                                   id="cpf"
                                                   th:field="*{cpf}"
                                                   th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="000.000.000-00"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('cpf')}"
                                                 th:errors="*{cpf}"></div>
                                        </div>

                                    </div>
                                </div>

                                <!-- Contato -->
                                <div style="margin-bottom:1.5rem;">
                                    <h3 style="font-size:var(--ph-font-size-sm);font-weight:700;color:var(--ph-text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1rem;">
                                        Contato
                                    </h3>

                                    <div class="ph-form-grid ph-form-grid--2">

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="email">
                                                E-mail <span class="required">*</span>
                                            </label>
                                            <input type="email"
                                                   id="email"
                                                   th:field="*{email}"
                                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="email@exemplo.com"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('email')}"
                                                 th:errors="*{email}"></div>
                                        </div>

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="telefone">
                                                Telefone <span class="required">*</span>
                                            </label>
                                            <input type="tel"
                                                   id="telefone"
                                                   th:field="*{telefone}"
                                                   th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="(00) 00000-0000"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('telefone')}"
                                                 th:errors="*{telefone}"></div>
                                        </div>

                                    </div>
                                </div>

                                <!-- Status -->
                                <div style="margin-bottom:1.5rem;">
                                    <h3 style="font-size:var(--ph-font-size-sm);font-weight:700;color:var(--ph-text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1rem;">
                                        Status
                                    </h3>
                                    <div class="ph-form-grid ph-form-grid--2">
                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="status">Status do Locatário</label>
                                            <select id="status" th:field="*{status}" class="ph-form-control">
                                                <option value="ATIVO">Ativo</option>
                                                <option value="INATIVO">Inativo</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <!-- Ações -->
                                <div class="ph-card__footer" style="margin:-1.5rem -1.5rem -1.5rem;border-radius:0 0 var(--ph-radius-lg) var(--ph-radius-lg);">
                                    <button type="submit" class="ph-btn ph-btn--primary">
                                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                                        Salvar Locatário
                                    </button>
                                    <a th:href="@{/usuario/abrirpesquisar}" class="ph-btn ph-btn--outline">
                                        Cancelar
                                    </a>
                                </div>

                            </form>
                        </div><!-- /card-body -->
                    </div><!-- /ph-card -->

                </div><!-- /th:fragment="formulario" -->
            </div>

        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts-base}"/>

</body>
</html>
