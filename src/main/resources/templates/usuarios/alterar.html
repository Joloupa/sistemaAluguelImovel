<!DOCTYPE html>
<!--
  PRIMEHOUSE — usuarios/alterar.html
  Formulário de alteração de locatário — retornado como fragment para modal HTMX
  Controller: return "usuarios/alterar :: formulario"
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- =====================================================================
     FRAGMENT: formulario
     Carregado via HTMX em #modalAlterarUsuarioConteudo
     ===================================================================== -->
<div th:fragment="formulario">

    <div class="ph-modal__header">
        <div class="ph-modal__title">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.46a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
            Alterar Locatário
            <span th:if="${usuarioDTOInput != null}"
                  style="font-size:var(--ph-font-size-sm);font-weight:500;color:var(--ph-text-muted);"
                  th:text="'#' + ${usuarioDTOInput.codigo}"></span>
        </div>
        <button type="button" class="ph-modal__close" onclick="fecharModalUsuario()" aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>

    <!-- Alertas globais -->
    <div th:if="${#fields.hasGlobalErrors()}"
         class="ph-alert ph-alert--danger"
         style="margin:1rem 1.5rem 0;">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <div class="ph-alert__content">
            <div class="ph-alert__title">Corrija os erros abaixo</div>
            <ul style="margin:4px 0 0 1rem;font-size:var(--ph-font-size-xs);">
                <li th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></li>
            </ul>
        </div>
    </div>

    <div class="ph-modal__body">

        <form th:action="@{/usuario/alterar}"
              th:object="${usuarioDTOInput}"
              method="post"
              hx-post="/usuario/alterar"
              hx-target="#modalAlterarUsuarioConteudo"
              hx-indicator="#loadingGlobal">

            <input type="hidden" th:field="*{codigo}"/>

            <!-- Dados pessoais -->
            <div style="margin-bottom:1.25rem;">
                <h3 style="font-size:var(--ph-font-size-xs);font-weight:700;color:var(--ph-text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:.75rem;">
                    Dados Pessoais
                </h3>
                <div class="ph-form-grid ph-form-grid--2">

                    <div class="ph-form-group">
                        <label class="ph-form-label" for="nomeAlt">
                            Nome Completo <span class="required">*</span>
                        </label>
                        <input type="text"
                               id="nomeAlt"
                               th:field="*{nome}"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                               class="ph-form-control"
                               placeholder="Nome completo"
                               maxlength="255"/>
                        <div class="ph-form-error"
                             th:if="${#fields.hasErrors('nome')}"
                             th:errors="*{nome}"></div>
                    </div>

                    <div class="ph-form-group">
                        <label class="ph-form-label" for="cpfAlt">
                            CPF <span class="required">*</span>
                        </label>
                        <input type="text"
                               id="cpfAlt"
                               th:field="*{cpf}"
                               th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                               class="ph-form-control"
                               placeholder="000.000.000-00"/>
                        <div class="ph-form-error"
                             th:if="${#fields.hasErrors('cpf')}"
                             th:errors="*{cpf}"></div>
                    </div>

                </div>
            </div>

            <!-- Contato -->
            <div style="margin-bottom:1.25rem;">
                <h3 style="font-size:var(--ph-font-size-xs);font-weight:700;color:var(--ph-text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:.75rem;">
                    Contato
                </h3>
                <div class="ph-form-grid ph-form-grid--2">

                    <div class="ph-form-group">
                        <label class="ph-form-label" for="emailAlt">
                            E-mail <span class="required">*</span>
                        </label>
                        <input type="email"
                               id="emailAlt"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               class="ph-form-control"
                               placeholder="email@exemplo.com"/>
                        <div class="ph-form-error"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>

                    <div class="ph-form-group">
                        <label class="ph-form-label" for="telefoneAlt">
                            Telefone <span class="required">*</span>
                        </label>
                        <input type="tel"
                               id="telefoneAlt"
                               th:field="*{telefone}"
                               th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                               class="ph-form-control"
                               placeholder="(00) 00000-0000"/>
                        <div class="ph-form-error"
                             th:if="${#fields.hasErrors('telefone')}"
                             th:errors="*{telefone}"></div>
                    </div>

                </div>
            </div>

            <!-- Status -->
            <div style="margin-bottom:1.25rem;">
                <div class="ph-form-group">
                    <label class="ph-form-label" for="statusAlt">Status</label>
                    <select id="statusAlt" th:field="*{status}" class="ph-form-control" style="max-width:220px;">
                        <option value="ATIVO">Ativo</option>
                        <option value="INATIVO">Inativo</option>
                    </select>
                </div>
            </div>

            <div class="ph-modal__footer" style="margin:-1.5rem -1.5rem -1.5rem;border-radius:0 0 var(--ph-radius-lg) var(--ph-radius-lg);">
                <button type="button" class="ph-btn ph-btn--outline" onclick="fecharModalUsuario()">
                    Cancelar
                </button>
                <button type="submit" class="ph-btn ph-btn--primary">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                    Salvar Alterações
                </button>
            </div>

        </form>

    </div><!-- /ph-modal__body -->

</div><!-- /th:fragment="formulario" -->

</body>
</html>
