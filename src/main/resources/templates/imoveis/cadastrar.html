<!DOCTYPE html>
<!--
  PRIMEHOUSE — imoveis/cadastrar.html
  Formulário de cadastro de imóvel
  Spring MVC + Thymeleaf + HTMX
  Controller retorna: "imoveis/cadastrar :: formulario"
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar Imóvel')}"></head>
<body class="ph-layout">

<!-- Overlay mobile -->
<div class="ph-sidebar-overlay" id="sidebarOverlay"></div>

<div class="ph-wrapper">

    <!-- ── Sidebar ── -->
    <th:block th:replace="~{fragments/layout :: sidebar('imoveis-cadastrar')}"/>

    <!-- ── Área principal ── -->
    <main class="ph-main">

        <!-- Topbar -->
        <th:block th:replace="~{fragments/layout :: topbar('Imóveis', 'Cadastrar')}"/>

        <!-- Notificações flash -->
        <th:block th:replace="~{fragments/layout :: notificacoes}"/>

        <!-- Conteúdo -->
        <div class="ph-content">

            <!-- Header da página -->
            <div class="ph-page-header ph-flex-between" style="flex-wrap:wrap;gap:1rem;">
                <div>
                    <h1 class="ph-page-header__title">Cadastrar Imóvel</h1>
                    <p class="ph-page-header__subtitle">Preencha os dados para registrar um novo imóvel</p>
                </div>
                <div class="ph-page-header__actions">
                    <a th:href="@{/imovel/abrirpesquisar}" class="ph-btn ph-btn--outline">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        Voltar
                    </a>
                </div>
            </div>

            <!-- Formulário — renderizado via fragment HTMX -->
            <div id="formularioCadastro"
                 hx-get="/imovel/cadastrar"
                 hx-trigger="load"
                 hx-target="#formularioCadastro"
                 hx-indicator="#loadingGlobal">

                <!-- ================================================================
                     FRAGMENT: formulario
                     Controller: return "imoveis/cadastrar :: formulario"
                     ================================================================ -->
                <div th:fragment="formulario">

                    <div class="ph-card">

                        <div class="ph-card__header">
                            <div class="ph-card__title">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                                Dados do Imóvel
                            </div>
                        </div>

                        <div class="ph-card__body">

                            <!-- avia aqui a div: <div style="margin-bottom:1.5rem;">, agora está dentro do  <form th:action="@{/imovel/cadastrar}" -->

                            <form th:action="@{/imovel/cadastrar}"
                                  th:object="${imovelDTOInput}"
                                  method="post"
                                  hx-post="/imovel/cadastrar"
                                  hx-target="#formularioCadastro"
                                  hx-indicator="#loadingGlobal">

                                  <!-- Alertas de erro globais --> 
                                <div th:if="${#fields.hasGlobalErrors()}"
                                    class="ph-alert ph-alert--danger ph-mb-6">
                                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                                    <div class="ph-alert__content">
                                        <div class="ph-alert__title">Corrija os erros abaixo</div>
                                        <ul style="margin:4px 0 0 1rem;font-size:var(--ph-font-size-xs);">
                                            <li th:each="erro : ${#fields.globalErrors()}"
                                                th:text="${erro}"></li>
                                        </ul>
                                    </div>
                                </div> 

                                <!-- Seção: Tipo e Status -->   <!-- SubstituidoPor: bloco movido para dentro do form ( a div de baixo estava em cima do <form th:action="@{/imovel/cadastrar}" )-->
                                <div style="margin-bottom:1.5rem;">
                                    <h3 style="font-size:var(--ph-font-size-sm);font-weight:700;color:var(--ph-text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1rem;">
                                        Classificação
                                    </h3>
                                    <div class="ph-form-grid ph-form-grid--3">

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="tipoImovel">
                                                Tipo de Imóvel <span class="required">*</span>
                                            </label>
                                            <select id="tipoImovel"
                                                    th:field="*{tipoImovel}"
                                                    th:classappend="${#fields.hasErrors('tipoImovel')} ? 'is-invalid'"
                                                    class="ph-form-control">
                                                <option value="">Selecione...</option>
                                                <option th:each="tipo : ${tipos}"
                                                        th:value="${tipo.name()}"
                                                        th:text="${tipo.descricao}">Tipo</option>
                                            </select>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('tipoImovel')}"
                                                 th:errors="*{tipoImovel}"></div>
                                        </div>

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="status">Status</label>
                                            <select id="status"
                                                    th:field="*{status}"
                                                    class="ph-form-control">
                                                <option value="DISPONIVEL">Disponível</option>
                                                <option value="ALUGADO">Alugado</option>
                                            </select>
                                        </div>

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="valorAluguel">
                                                Valor do Aluguel (R$) <span class="required">*</span>
                                            </label>
                                            <input type="number"
                                                   id="valorAluguel"
                                                   th:field="*{valorAluguel}"
                                                   step="0.01"
                                                   th:classappend="${#fields.hasErrors('valorAluguel')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="Ex: 2500"
                                                   min="0"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('valorAluguel')}"
                                                 th:errors="*{valorAluguel}"></div>
                                        </div>

                                    </div>
                                </div>

                                <!-- Seção: Localização -->
                                <div style="margin-bottom:1.5rem;">
                                    <h3 style="font-size:var(--ph-font-size-sm);font-weight:700;color:var(--ph-text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1rem;">
                                        Localização
                                    </h3>
                                    <div class="ph-form-grid ph-form-grid--3">

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="bairro">
                                                Bairro <span class="required">*</span>
                                            </label>
                                            <input type="text"
                                                   id="bairro"
                                                   th:field="*{bairro}"
                                                   th:classappend="${#fields.hasErrors('bairro')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="Ex: Centro"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('bairro')}"
                                                 th:errors="*{bairro}"></div>
                                        </div>

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="cidade">
                                                Cidade <span class="required">*</span>
                                            </label>
                                            <input type="text"
                                                   id="cidade"
                                                   th:field="*{cidade}"
                                                   th:classappend="${#fields.hasErrors('cidade')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="Ex: São Paulo"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('cidade')}"
                                                 th:errors="*{cidade}"></div>
                                        </div>

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="estado">
                                                Estado (UF) <span class="required">*</span>
                                            </label>
                                            <input type="text"
                                                   id="estado"
                                                   th:field="*{estado}"
                                                   th:classappend="${#fields.hasErrors('estado')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="Ex: SP"
                                                   maxlength="2"
                                                   style="text-transform:uppercase;"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('estado')}"
                                                 th:errors="*{estado}"></div>
                                        </div>

                                    </div>
                                </div>

                                <!-- Seção: Proprietário e Descrição -->
                                <div style="margin-bottom:1.5rem;">
                                    <h3 style="font-size:var(--ph-font-size-sm);font-weight:700;color:var(--ph-text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1rem;">
                                        Detalhes
                                    </h3>
                                    <div class="ph-form-grid ph-form-grid--2">

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="proprietario">
                                                Proprietário <span class="required">*</span>
                                            </label>
                                            <input type="text"
                                                   id="proprietario"
                                                   th:field="*{proprietario}"
                                                   th:classappend="${#fields.hasErrors('proprietario')} ? 'is-invalid'"
                                                   class="ph-form-control"
                                                   placeholder="Nome completo do proprietário"/>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('proprietario')}"
                                                 th:errors="*{proprietario}"></div>
                                        </div>

                                        <div class="ph-form-group">
                                            <label class="ph-form-label" for="descricao">
                                                Descrição <span class="required">*</span>
                                            </label>
                                            <textarea id="descricao"
                                                      th:field="*{descricao}"
                                                      th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                                                      class="ph-form-control"
                                                      placeholder="Descreva as características do imóvel..."
                                                      rows="3"
                                                      maxlength="255"></textarea>
                                            <div class="ph-form-help">Máximo 255 caracteres</div>
                                            <div class="ph-form-error"
                                                 th:if="${#fields.hasErrors('descricao')}"
                                                 th:errors="*{descricao}"></div>
                                        </div>

                                    </div>
                                </div>

                                <!-- Ações do formulário -->
                                <div class="ph-card__footer" style="margin:-1.5rem -1.5rem -1.5rem;border-radius:0 0 var(--ph-radius-lg) var(--ph-radius-lg);">
                                    <button type="submit" class="ph-btn ph-btn--primary">
                                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                                        Salvar Imóvel
                                    </button>
                                    <a th:href="@{/imovel/abrirpesquisar}" class="ph-btn ph-btn--outline">
                                        Cancelar
                                    </a>
                                </div>

                            </form>

                        </div><!-- /card-body -->
                    </div><!-- /ph-card -->

                </div><!-- /th:fragment="formulario" -->
            </div><!-- /formularioCadastro -->

        </div><!-- /ph-content -->
    </main>
</div><!-- /ph-wrapper -->

<th:block th:replace="~{fragments/layout :: scripts-base}"/>

</body>
</html>
