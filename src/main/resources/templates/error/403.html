<!DOCTYPE html>
<!--
  PRIMEHOUSE — error/403.html
  Página de erro 403 Forbidden
  Controller: return "error/403"  ou  "error/403 :: conteudo" (HTMX)
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acesso negado')}"></head>
<body class="ph-layout">

<div class="ph-sidebar-overlay" id="sidebarOverlay"></div>

<div class="ph-wrapper">

    <th:block th:replace="~{fragments/layout :: sidebar('inicio')}"/>

    <main class="ph-main">

        <th:block th:replace="~{fragments/layout :: topbar('Acesso negado', null)}"/>

        <div class="ph-content">

            <div th:fragment="conteudo" class="ph-error-page">

                <div class="ph-error-page__code">403</div>

                <h1 class="ph-error-page__title">Acesso negado</h1>

                <p class="ph-error-page__text">
                    Você não tem permissão para acessar este recurso.
                    Entre em contato com o administrador do sistema.
                </p>

                <div class="ph-flex-center ph-gap-3" style="flex-wrap:wrap;">
                    <a th:href="@{/}" class="ph-btn ph-btn--primary ph-btn--lg">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        Ir para o Início
                    </a>
                </div>

            </div>

        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts-base}"/>

</body>
</html>
